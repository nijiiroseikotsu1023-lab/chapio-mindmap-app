<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#f6f8fc"/>
<title>Chapio 思考マップ v1.2</title>
<style>
:root{--bg:#f6f8fc;--grid:#dce6f4;--ink:#172033;--muted:#6d7b91;--line:#3b82f6;--node:#fff;--root:#2f4a73;--accent:#2563eb;--warn:#f59e0b;--danger:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}button{font:inherit}.app{height:100%;display:flex;flex-direction:column}.topbar{height:62px;background:#fff;border-bottom:1px solid #dbe3ef;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:30;overflow-x:auto;white-space:nowrap}.brand{font-weight:800;font-size:18px;margin-right:6px}.btn{border:1px solid #cbd7e8;background:#fff;border-radius:12px;padding:9px 12px;color:#24334b}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.small{padding:7px 10px;font-size:14px}.main{position:relative;flex:1;overflow:hidden}#canvas{position:absolute;inset:0;touch-action:none;background-image:radial-gradient(var(--grid) 1.3px,transparent 1.3px);background-size:26px 26px;background-color:var(--bg)}#world{position:absolute;left:0;top:0;transform-origin:0 0;width:4000px;height:3000px}#links{position:absolute;left:0;top:0;width:4000px;height:3000px;overflow:visible;pointer-events:none}.node{position:absolute;min-width:150px;max-width:260px;padding:10px 12px;border:2px solid #9db8e8;background:#fff;border-radius:16px;box-shadow:0 5px 16px rgba(30,55,90,.08);display:flex;align-items:center;gap:8px;user-select:none;touch-action:none}.node.root{background:var(--root);color:#fff;border-color:#3b82f6}.node.selected{outline:4px solid rgba(245,158,11,.5)}.node.locked::after{content:"🔒";font-size:12px;position:absolute;right:-8px;top:-10px}.node.suggested{border-style:dashed;border-color:var(--warn);background:#fffaf0}.label{width:100%;min-width:70px;outline:none;font-weight:700;font-size:17px;line-height:1.35;word-break:break-word;cursor:text}.node:not(.root) .label{font-weight:600;color:#24334b}.iconbtn{width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:#eaf1fb;color:#21344f;font-weight:800;font-size:20px;flex:0 0 auto}.root .iconbtn{background:#fff;color:#203b64}.hint{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.93);border:1px solid #edf1f7;border-radius:14px;padding:10px 12px;color:#64748b;font-size:13px;z-index:15;max-width:min(92%,620px)}.bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;z-index:20;overflow-x:auto}.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:#172033;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90%;text-align:center}.toast.show{opacity:1}.panel{position:absolute;right:10px;top:10px;width:min(360px,calc(100% - 20px));max-height:calc(100% - 86px);overflow:auto;background:#fff;border:1px solid #dfe6f0;border-radius:16px;padding:14px;z-index:35;box-shadow:0 12px 30px rgba(23,32,51,.16)}.hidden{display:none!important}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:12px;background:#eef4ff;color:#2f5f9f;margin-right:4px}.badge.warn{background:#fff4db;color:#a06400}.badge.red{background:#ffe9e9;color:#b42318}.failsafe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#2f4a73;color:#fff;border:3px solid #3b82f6;border-radius:16px;padding:14px 18px;font-weight:800;z-index:3}
@media(max-width:760px){.topbar{height:58px}.brand{font-size:16px}.btn{padding:8px 10px}.hint{font-size:12px}.node{min-width:132px;max-width:230px}.label{font-size:16px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">🌱 <b>Chapio</b> 思考マップ <span style="font-size:12px;color:#70809a">v1.2</span></div>
    <button class="btn small" id="newMap">白紙</button>
    <button class="btn small" id="saveLocal">保存</button>
    <button class="btn small" id="exportBtn">書出</button>
    <button class="btn small" id="importBtn">読込</button>
    <button class="btn small" id="auditBtn">考慮漏れ</button>
    <button class="btn small" id="fitBtn">全体表示</button>
    <input id="fileInput" type="file" accept="application/json" hidden>
  </div>
  <div class="main">
    <div id="canvas">
      <div id="world">
        <svg id="links"></svg>
        <div id="nodes"></div>
        <div class="failsafe" id="failsafe">テーマを入力</div>
      </div>
      <div class="hint">文字をタップ：直接編集 ／ ＋：子の枝を追加 ／ ▾：折りたたみ ／ ノード余白をドラッグ：位置変更 ／ 画面ドラッグ：移動 ／ ピンチ：拡大縮小</div>
      <div class="bottom">
        <button class="btn primary" id="addChild">＋ 枝を追加</button>
        <button class="btn" id="toggleLock">🔒 固定</button>
        <button class="btn" id="connectBtn">点線候補</button>
        <button class="btn" id="deleteBtn">削除</button>
        <button class="btn" id="undoBtn">↶ 戻す</button>
      </div>
      <div class="toast" id="toast"></div>
      <div class="panel hidden" id="auditPanel"></div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), world=$('#world'), nodesEl=$('#nodes'), svg=$('#links'), canvas=$('#canvas'), toast=$('#toast'), auditPanel=$('#auditPanel'), failsafe=$('#failsafe');
let state, history=[], drag=null, pan=null, pinch=null, linkMode=null;
const KEY='chapio-mindmap-v12';
const uid=()=>Math.random().toString(36).slice(2,9);
function defaultState(){return {nodes:{root:{id:'root',text:'テーマを入力',x:320,y:340,parent:null,collapsed:false,locked:false,suggested:false,notes:''}},links:[],selected:'root',panX:0,panY:0,scale:1};}
function safeGet(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function safeSet(v){try{localStorage.setItem(KEY,v)}catch(e){}}
function notify(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
function pushHistory(){try{history.push(JSON.stringify(state));if(history.length>60)history.shift()}catch(e){}}
function save(){safeSet(JSON.stringify(state))}
function children(id){return Object.values(state.nodes).filter(n=>n.parent===id)}
function hiddenByAncestor(n){let p=n.parent;while(p){const pn=state.nodes[p];if(!pn)break;if(pn.collapsed)return true;p=pn.parent}return false}
function path(a,b){const ax=a.x+170, ay=a.y+26, bx=b.x, by=b.y+26, c1=ax+(bx-ax)*.42, c2=bx-(bx-ax)*.42;return `M ${ax} ${ay} C ${c1} ${ay}, ${c2} ${by}, ${bx} ${by}`}
function render(){
  try{
    failsafe.style.display='none';
    world.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.scale})`;
    nodesEl.innerHTML='';svg.innerHTML='';
    Object.values(state.nodes).forEach(n=>{
      if(hiddenByAncestor(n))return;
      const d=document.createElement('div');
      d.className='node'+(n.parent?'':' root')+(state.selected===n.id?' selected':'')+(n.locked?' locked':'')+(n.suggested?' suggested':'');
      d.style.left=n.x+'px';d.style.top=n.y+'px';d.dataset.id=n.id;
      const label=document.createElement('div');label.className='label';label.contentEditable='true';label.spellcheck=true;label.textContent=n.text;
      label.addEventListener('pointerdown',e=>{e.stopPropagation();state.selected=n.id;selectionOnly()});
      label.addEventListener('focus',()=>{state.selected=n.id;selectionOnly()});
      label.addEventListener('input',()=>{n.text=label.textContent.trim()||'';save()});
      label.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();label.blur()}});
      d.appendChild(label);
      const add=document.createElement('button');add.className='iconbtn';add.textContent='+';add.addEventListener('pointerdown',e=>e.stopPropagation());add.onclick=e=>{e.stopPropagation();select(n.id);addChildNode(n.id,true)};d.appendChild(add);
      if(children(n.id).length){const c=document.createElement('button');c.className='iconbtn';c.textContent=n.collapsed?'▸':'▾';c.addEventListener('pointerdown',e=>e.stopPropagation());c.onclick=e=>{e.stopPropagation();pushHistory();n.collapsed=!n.collapsed;render();save()};d.appendChild(c)}
      d.addEventListener('pointerdown',startNodeDrag);d.addEventListener('click',()=>select(n.id));nodesEl.appendChild(d);
    });
    Object.values(state.nodes).forEach(n=>{if(!n.parent||hiddenByAncestor(n))return;const p=state.nodes[n.parent];if(!p||hiddenByAncestor(p))return;const q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',path(p,n));q.setAttribute('fill','none');q.setAttribute('stroke',n.suggested?'#f59e0b':'#3b82f6');q.setAttribute('stroke-width','4');if(n.suggested)q.setAttribute('stroke-dasharray','8 7');svg.appendChild(q)});
    state.links.forEach(l=>{const a=state.nodes[l.from],b=state.nodes[l.to];if(!a||!b||hiddenByAncestor(a)||hiddenByAncestor(b))return;const q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',path(a,b));q.setAttribute('fill','none');q.setAttribute('stroke','#f59e0b');q.setAttribute('stroke-width','3');q.setAttribute('stroke-dasharray','9 7');svg.appendChild(q)});
  }catch(e){failsafe.style.display='block';}
}
function selectionOnly(){document.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',el.dataset.id===state.selected))}
function select(id){state.selected=id;selectionOnly()}
function addChildNode(parentId,focus){const p=state.nodes[parentId];if(!p)return;pushHistory();const s=children(parentId),id=uid();state.nodes[id]={id,text:'新しい枝',x:p.x+280,y:p.y+(s.length-1)*80,parent:parentId,collapsed:false,locked:false,suggested:false,notes:''};state.selected=id;render();save();if(focus)setTimeout(()=>{const el=document.querySelector(`.node[data-id="${id}"] .label`);if(el){el.focus();const r=document.createRange();r.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}},50)}
function startNodeDrag(e){if(e.target.closest('.label')||e.target.closest('button'))return;const id=e.currentTarget.dataset.id,n=state.nodes[id];state.selected=id;selectionOnly();if(n.locked){notify('この枝は固定されています');return}pushHistory();drag={id,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y};try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()}
window.addEventListener('pointermove',e=>{if(drag){const n=state.nodes[drag.id];n.x=drag.ox+(e.clientX-drag.sx)/state.scale;n.y=drag.oy+(e.clientY-drag.sy)/state.scale;render()}else if(pan){state.panX=pan.ox+(e.clientX-pan.sx);state.panY=pan.oy+(e.clientY-pan.sy);render()}})
window.addEventListener('pointerup',()=>{if(drag||pan)save();drag=null;pan=null})
canvas.addEventListener('pointerdown',e=>{if(e.target!==canvas&&e.target!==world&&e.target!==svg)return;pan={sx:e.clientX,sy:e.clientY,ox:state.panX,oy:state.panY};e.preventDefault()})
canvas.addEventListener('wheel',e=>{e.preventDefault();const old=state.scale,next=Math.max(.35,Math.min(2.2,old*(e.deltaY<0?1.08:.92))),r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,wx=(mx-state.panX)/old,wy=(my-state.panY)/old;state.scale=next;state.panX=mx-wx*next;state.panY=my-wy*next;render();save()},{passive:false})
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pinch={dist:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),scale:state.scale};e.preventDefault()}},{passive:false})
canvas.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){const[a,b]=e.touches,d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);state.scale=Math.max(.35,Math.min(2.2,pinch.scale*d/pinch.dist));render();e.preventDefault()}},{passive:false})
canvas.addEventListener('touchend',()=>{pinch=null;save()})
function fit(){const vis=Object.values(state.nodes).filter(n=>!hiddenByAncestor(n));if(!vis.length)return;const xs=vis.map(n=>n.x),ys=vis.map(n=>n.y),minX=Math.min(...xs)-80,maxX=Math.max(...xs)+340,minY=Math.min(...ys)-120,maxY=Math.max(...ys)+160,w=maxX-minX,h=maxY-minY,r=canvas.getBoundingClientRect();state.scale=Math.max(.35,Math.min(1.2,Math.min(r.width/w,r.height/h)));state.panX=(r.width-w*state.scale)/2-minX*state.scale;state.panY=(r.height-h*state.scale)/2-minY*state.scale;render();save()}
function audit(){const texts=Object.values(state.nodes).map(n=>n.text.trim()).filter(Boolean),dup=[];for(let i=0;i<texts.length;i++)for(let j=i+1;j<texts.length;j++)if(texts[i]===texts[j]&&!dup.includes(texts[i]))dup.push(texts[i]);const cats=['目的','根拠','選択肢','リスク','相手の視点','時間軸','次の行動'],joined=texts.join(' '),miss=cats.filter(c=>!joined.includes(c));auditPanel.innerHTML=`<h3>思考チェック</h3>${dup.length?`<p><span class="badge red">重複候補</span>${dup.join('、')}</p>`:''}<p><span class="badge warn">検討候補</span>${miss.length?miss.join('・'):'大きな欠如候補は見つかりませんでした'}</p><p style="font-size:14px;color:#667085">断定ではなく「この観点は検討済みですか？」という確認候補です。</p><button class="btn small" id="closeAudit">閉じる</button>`;auditPanel.classList.remove('hidden');$('#closeAudit').onclick=()=>auditPanel.classList.add('hidden')}
function descendants(id){const out=[];(function rec(pid){children(pid).forEach(c=>{out.push(c.id);rec(c.id)})})(id);return out}
function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chapio-mindmap.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importJson(file){const r=new FileReader();r.onload=()=>{try{pushHistory();state=JSON.parse(r.result);render();save();notify('読み込みました')}catch(e){notify('読み込みに失敗しました')}};r.readAsText(file)}
$('#newMap').onclick=()=>{if(confirm('白紙に戻しますか？')){pushHistory();state=defaultState();render();fit();save()}};$('#saveLocal').onclick=()=>{save();notify('この端末に保存しました')};$('#exportBtn').onclick=exportJson;$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>e.target.files[0]&&importJson(e.target.files[0]);$('#auditBtn').onclick=audit;$('#fitBtn').onclick=fit;$('#addChild').onclick=()=>state.selected?addChildNode(state.selected,true):notify('枝を選択してください');$('#toggleLock').onclick=()=>{const n=state.nodes[state.selected];if(!n)return;pushHistory();n.locked=!n.locked;render();save();notify(n.locked?'固定しました':'固定を解除しました')};$('#deleteBtn').onclick=()=>{const id=state.selected;if(!id||id==='root')return notify('中心テーマは削除できません');pushHistory();const del=[id,...descendants(id)];del.forEach(x=>delete state.nodes[x]);state.links=state.links.filter(l=>!del.includes(l.from)&&!del.includes(l.to));state.selected='root';render();save()};$('#undoBtn').onclick=()=>{if(!history.length)return notify('戻せる履歴がありません');state=JSON.parse(history.pop());render();save()};$('#connectBtn').onclick=()=>{if(!state.selected)return notify('枝を選択してください');linkMode=state.selected;notify('関連づける相手の枝をタップ');const h=e=>{const el=e.target.closest('.node');if(!el)return;const to=el.dataset.id;if(to!==linkMode){pushHistory();state.links.push({from:linkMode,to,kind:'suggestion'});render();save();notify('点線候補を追加しました')}document.removeEventListener('click',h,true);linkMode=null};setTimeout(()=>document.addEventListener('click',h,true),0)};
try{const saved=safeGet();state=saved?JSON.parse(saved):defaultState()}catch(e){state=defaultState()}
render();setTimeout(()=>{if(!safeGet())fit()},80);
})();
</script>
</body>
</html>
