<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

<title>Chapio 思考マップ v1.6</title>
<style>
:root{--bg:#f6f8fc;--grid:#dce6f4;--ink:#172033;--muted:#6d7b91;--line:#3b82f6;--node:#fff;--root:#2f4a73;--accent:#2563eb;--warn:#f59e0b;--danger:#ef4444;--ok:#10b981;--cycle:#7c3aed;--panel:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}button,input,textarea{font:inherit}.app{height:100%;display:flex;flex-direction:column}.topbar{height:62px;background:#fff;border-bottom:1px solid #dbe3ef;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:30;overflow-x:auto;white-space:nowrap}.brand{font-weight:800;font-size:18px;margin-right:6px}.btn{border:1px solid #cbd7e8;background:#fff;border-radius:12px;padding:9px 12px;color:#24334b}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.warn{border-color:#f3c16a;background:#fffaf0}.btn.danger{border-color:#f5b7b7;background:#fff5f5;color:#b42318}.btn.small{padding:7px 10px;font-size:14px}.btn:active{transform:scale(.98)}.main{position:relative;flex:1;overflow:hidden}#canvas{position:absolute;inset:0;touch-action:none;background-image:radial-gradient(var(--grid) 1.3px,transparent 1.3px);background-size:26px 26px;background-color:var(--bg)}#world{position:absolute;left:0;top:0;transform-origin:0 0;width:5000px;height:3500px}#links{position:absolute;left:0;top:0;width:5000px;height:3500px;overflow:visible;pointer-events:none}.node{position:absolute;min-width:150px;max-width:280px;padding:10px 12px;border:2px solid #9db8e8;background:#fff;border-radius:16px;box-shadow:0 5px 16px rgba(30,55,90,.08);display:flex;align-items:center;gap:8px;user-select:none;touch-action:none}.node.root{background:var(--root);color:#fff;border-color:#3b82f6}.node.selected{outline:4px solid rgba(245,158,11,.5)}.node.pinned::after{content:"📌";font-size:12px;position:absolute;right:-8px;top:-10px}.node.suggested{border-style:dashed;border-color:var(--warn);background:#fffaf0}.node.archived{opacity:.35;filter:grayscale(.6)}.label{width:100%;min-width:70px;outline:none;font-weight:700;font-size:17px;line-height:1.35;word-break:break-word;cursor:text}.node:not(.root) .label{font-weight:600;color:#24334b}.iconbtn{width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:#eaf1fb;color:#21344f;font-weight:800;font-size:20px;flex:0 0 auto}.root .iconbtn{background:#fff;color:#203b64}.hint{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.94);border:1px solid #edf1f7;border-radius:14px;padding:10px 12px;color:#64748b;font-size:13px;z-index:15;max-width:min(92%,700px)}.bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;z-index:20;overflow-x:auto;overflow-y:hidden;padding:2px 2px calc(2px + env(safe-area-inset-bottom));scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}.bottom::-webkit-scrollbar{display:none}.bottom .btn{flex:0 0 auto;white-space:nowrap;min-width:max-content}.toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);background:#172033;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:45;max-width:92%;text-align:center}.toast.show{opacity:1}.panel{position:absolute;right:10px;top:10px;width:min(390px,calc(100% - 20px));max-height:calc(100% - 92px);overflow:auto;background:#fff;border:1px solid #dfe6f0;border-radius:16px;padding:14px;z-index:40;box-shadow:0 12px 30px rgba(23,32,51,.16)}.panel h3{margin:0 0 8px}.panel h4{margin:14px 0 6px}.panel p{margin:6px 0;color:#5f6e84;font-size:14px;line-height:1.5}.panel .row{display:flex;gap:8px;flex-wrap:wrap}.panel textarea{width:100%;min-height:110px;border:1px solid #ccd8e8;border-radius:12px;padding:10px;resize:vertical}.hidden{display:none!important}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:12px;background:#eef4ff;color:#2f5f9f;margin-right:4px}.badge.warn{background:#fff4db;color:#a06400}.badge.red{background:#ffe9e9;color:#b42318}.badge.purple{background:#f1eaff;color:#6d28d9}.finding{border-top:1px solid #edf1f7;padding:9px 0}.finding:first-of-type{border-top:0}.failsafe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#2f4a73;color:#fff;border:3px solid #3b82f6;border-radius:16px;padding:14px 18px;font-weight:800;z-index:3}.status{position:absolute;right:12px;bottom:76px;background:rgba(255,255,255,.9);border:1px solid #e2e8f0;border-radius:10px;padding:6px 9px;font-size:12px;color:#64748b;z-index:10}.mini{font-size:12px;color:#7b8797}.switchrow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
@media(max-width:760px){.topbar{height:58px}.brand{font-size:16px}.btn{padding:8px 10px}.hint{font-size:12px}.node{min-width:132px;max-width:235px}.label{font-size:16px}.status{display:none}.bottom{left:8px;right:8px;gap:7px}.bottom .btn{padding:10px 14px;font-size:15px;border-radius:14px}}
.iconbtn{width:36px;height:36px}@media(max-width:760px){.node{max-width:260px}.iconbtn{width:44px;height:44px}}
.voice-log{margin:8px 0;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#f6f8fc;border:1px solid #dbe3ef;border-radius:10px;padding:9px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.voice-state{font-weight:800;color:#1d4ed8}.voice-state.failed{color:#b42318}@media(max-width:760px){.voice-log{max-height:145px}.panel.voice-panel{top:6px;right:6px;width:calc(100% - 12px);max-height:calc(100% - 76px);padding:12px}.panel.voice-panel .btn{min-height:44px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">🌱 <b>Chapio</b> 思考マップ <span style="font-size:12px;color:#70809a">v1.6</span></div>
    <button class="btn small" id="newMap">白紙</button>
    <button class="btn small" id="saveLocal">保存</button>
    <button class="btn small" id="exportBtn">書出</button>
    <button class="btn small" id="importBtn">読込</button>
    <button class="btn small warn" id="auditBtn">AIチェック</button>
    <button class="btn small" id="colorBtn">線カラー</button>
    <button class="btn small" id="rainbowBtn">🌈 虹色OFF</button>
    <button class="btn small" id="archivedListBtn">保留一覧</button>
    <button class="btn small" id="aiCopyBtn">AI用コピー</button>
    <button class="btn small" id="aiShareBtn">AI連携</button>
    <button class="btn small" id="voiceBtn">🎤 音声入力</button>
    <button class="btn small" id="voiceHistoryBtn">音声診断履歴</button>
    <button class="btn small" id="fitBtn">全体表示</button>
    <input id="fileInput" type="file" accept="application/json" hidden>
  </div>
  <div class="main">
    <div id="canvas">
      <div id="world">
        <svg id="links"></svg>
        <div id="nodes"></div>
        <div class="failsafe" id="failsafe">テーマを入力</div>
      </div>
      <div class="hint">文字をタップ：直接編集 ／ ＋：子枝 ／ ▾：開閉 ／ ノード余白をドラッグ：位置変更＋自動固定 ／ 画面ドラッグ：移動 ／ ピンチ：拡大縮小 ／ 循環ループ：3点で一周</div>
      <div class="bottom">
        <button class="btn primary" id="addChild">＋ 子枝</button>
        <button class="btn" id="insertBtn">途中追加</button>
        <button class="btn" id="togglePin">📌 配置固定</button>
        <button class="btn" id="connectBtn">点線関係</button>
        <button class="btn" id="cycleBtn">循環ループ</button>
        <button class="btn warn" id="archiveBtn">剪定/保留</button>
        <button class="btn danger" id="deleteBtn">削除</button>
        <button class="btn" id="undoBtn">↶ 戻す</button>
      </div>
      <div class="status" id="status">端末内保存・外部送信なし</div>
      <div class="toast" id="toast"></div>
      <div class="panel hidden" id="sidePanel"></div>
    </div>
  </div>
</div>
<script src="voice-diagnostics.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), world=$('#world'), nodesEl=$('#nodes'), svg=$('#links'), canvas=$('#canvas'), toast=$('#toast'), panel=$('#sidePanel'), failsafe=$('#failsafe'), status=$('#status');
let state, history=[], drag=null, pan=null, pinch=null, linkMode=null, recoveryMode=false, activeVoiceSession=null, lastVoiceDiagnostic='', voiceSessionCounter=0, lastVoiceFinishReason='none', voiceDiagnosticHistory=[];
const KEY='chapio-mindmap-v16', RECOVERY_KEY=KEY+'-recovery', LEGACY_KEYS=['chapio-mindmap-v15','chapio-mindmap-v14','chapio-mindmap-v13'], MAX_FILE_BYTES=2*1024*1024, MAX_NODES=2000, MAX_LINKS=10000, MAX_TEXT=2000;
const uid=()=>Math.random().toString(36).slice(2,9);
function defaultState(){return {version:16,nodes:{root:{id:'root',text:'テーマを入力',x:320,y:340,parent:null,collapsed:false,pinned:false,suggested:false,archived:false,notes:'',lineColor:null}},links:[],selected:'root',panX:0,panY:0,scale:1,meta:{createdAt:Date.now(),updatedAt:Date.now(),rainbow:false}};}
function safeGet(key=KEY){try{return localStorage.getItem(key)}catch(e){return null}}
function storageKeyForSave(isRecovery){return isRecovery?RECOVERY_KEY:KEY}
function safeSet(v){try{localStorage.setItem(storageKeyForSave(recoveryMode),v);return true}catch(e){return false}}
function notify(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function serializeState(value){const serialized=JSON.stringify(value);if(new TextEncoder().encode(serialized).byteLength>MAX_FILE_BYTES)throw new Error('データ上限は2MBです');return serialized}
function parseStoredState(raw){if(typeof raw!=='string')return null;if(new TextEncoder().encode(raw).byteLength>MAX_FILE_BYTES)throw new Error('保存データが大きすぎます');const parsed=validateIncoming(JSON.parse(raw));serializeState(parsed);return parsed}
function resolveStoredState(primary,recovery){if(primary===null){if(recovery===null)return {state:defaultState(),recoveryMode:false};try{return {state:parseStoredState(recovery),recoveryMode:true}}catch(e){console.warn('復旧領域の保存データを読み込めません',e);return {state:defaultState(),recoveryMode:true}}}try{return {state:parseStoredState(primary),recoveryMode:false}}catch(e){console.warn('破損した保存データを上書きせず復旧領域を使用します',e);try{return {state:recovery?parseStoredState(recovery):defaultState(),recoveryMode:true}}catch(_){return {state:defaultState(),recoveryMode:true}}}}
function pushHistory(){try{history.push(serializeState(state));if(history.length>80)history.shift()}catch(e){}}
function setSaveStatus(message){try{if(status)status.textContent=message}catch(e){console.warn('保存後の表示更新に失敗しました',e)}}
function save(){state.meta=state.meta||{};state.meta.updatedAt=Date.now();let serialized;try{serialized=serializeState(state)}catch(e){setSaveStatus('保存失敗：データ上限2MB');return false}const ok=safeSet(serialized);setSaveStatus(ok?(recoveryMode?'復旧領域へ保存・破損元は保持':'端末内保存・外部送信なし'):'保存領域なし（JSON書出を推奨）');return ok}
function snapshotState(){return serializeState(state)}
function commitState(mutator){let before;try{before=snapshotState()}catch(e){return false}mutator(state);if(save()){history.push(before);if(history.length>80)history.shift();return true}state=parseStoredState(before);return false}
function children(id){return Object.values(state.nodes).filter(n=>n.parent===id)}
function hiddenByAncestor(n){let p=n.parent;while(p){const pn=state.nodes[p];if(!pn)break;if(pn.collapsed||pn.archived)return true;p=pn.parent}return false}
function visibleNodes(){return Object.values(state.nodes).filter(n=>!hiddenByAncestor(n)&&!n.archived)}
const PALETTE=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
function firstLevelAncestor(id){let n=state.nodes[id];if(!n)return null;while(n.parent&&n.parent!=='root')n=state.nodes[n.parent];return n&&n.parent==='root'?n:null}
function rainbowColorFor(id){const top=firstLevelAncestor(id);if(!top)return '#3b82f6';const roots=children('root').filter(n=>!n.archived);const idx=Math.max(0,roots.findIndex(n=>n.id===top.id));return PALETTE[idx%PALETTE.length]}
function edgeColor(n){if(state.meta&&state.meta.rainbow)return rainbowColorFor(n.id);let x=n;while(x){if(x.lineColor)return x.lineColor;x=x.parent?state.nodes[x.parent]:null}return n.suggested?'#f59e0b':'#3b82f6'}
function subtreeIds(id){return [id,...descendants(id)]}
function setBranchColor(color){const id=state.selected;if(!id)return notify('枝を選択してください');if(!commitState(s=>subtreeIds(id).forEach(x=>{if(s.nodes[x])s.nodes[x].lineColor=color})))return notify('線色を保存できないため変更しませんでした');render();notify('選択した枝系統の線色を変更しました')}
function showColorPanel(){const id=state.selected||'root';let html='<h3>線カラー</h3><p>選択した枝と、その下の子枝へ適用します。虹色モード中は虹色表示が優先されます。</p><div class="row">';PALETTE.forEach(c=>{html+=`<button data-linecolor="${c}" style="width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;background:${c}"></button>`});html+='</div><div class="row" style="margin-top:12px"><button class="btn small" id="resetColor">標準色に戻す</button><button class="btn small" id="closePanel">閉じる</button></div>';panel.innerHTML=html;panel.classList.remove('hidden');panel.querySelectorAll('[data-linecolor]').forEach(b=>b.onclick=()=>setBranchColor(b.dataset.linecolor));$('#resetColor').onclick=()=>{pushHistory();subtreeIds(id).forEach(x=>{if(state.nodes[x])state.nodes[x].lineColor=null});render();save();notify('標準色へ戻しました')};$('#closePanel').onclick=()=>panel.classList.add('hidden')}
function toggleRainbow(){const next=!(state.meta&&state.meta.rainbow);if(!commitState(s=>{s.meta=s.meta||{};s.meta.rainbow=next}))return notify('虹色設定を保存できないため変更しませんでした');$('#rainbowBtn').textContent=next?'🌈 虹色ON':'🌈 虹色OFF';render();notify(next?'虹色モードON':'虹色モードOFF')}

function path(a,b){const ax=a.x+170,ay=a.y+26,bx=b.x,by=b.y+26,c1=ax+(bx-ax)*.42,c2=bx-(bx-ax)*.42;return `M ${ax} ${ay} C ${c1} ${ay}, ${c2} ${by}, ${bx} ${by}`}
function cyclePath(a,b){const ax=a.x+170,ay=a.y+26,bx=b.x,by=b.y+26,dx=bx-ax,dy=by-ay,span=Math.max(120,Math.hypot(dx,dy)),lift=Math.min(240,Math.max(90,span*.42));const mx=(ax+bx)/2,my=(ay+by)/2-lift;return `M ${ax} ${ay} Q ${mx} ${my}, ${bx} ${by}` }
function addArrowDefs(){const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');defs.innerHTML='<marker id="arrowCycle" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker><marker id="arrowCycleGood" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker><marker id="arrowCycleBad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker><marker id="arrowRisk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ef4444"/></marker>';svg.appendChild(defs)}
function render(){
 try{
  failsafe.style.display='none';
  world.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.scale})`;
  nodesEl.innerHTML='';svg.innerHTML='';addArrowDefs();
  Object.values(state.nodes).forEach(n=>{
   if(hiddenByAncestor(n)||n.archived)return;
   const d=document.createElement('div');
   d.className='node'+(n.parent?'':' root')+(state.selected===n.id?' selected':'')+(n.pinned?' pinned':'')+(n.suggested?' suggested':'');
   d.style.left=n.x+'px';d.style.top=n.y+'px';d.dataset.id=n.id;
   const label=document.createElement('div');label.className='label';label.contentEditable='true';label.spellcheck=true;label.textContent=n.text;
   label.addEventListener('pointerdown',e=>{e.stopPropagation();state.selected=n.id;selectionOnly()});
   label.addEventListener('focus',()=>{state.selected=n.id;selectionOnly()});
   label.addEventListener('input',()=>{const old=n.text,next=label.textContent.slice(0,MAX_TEXT);if(next===old)return;if(!commitState(s=>{s.nodes[n.id].text=next})){label.textContent=old;notify('編集を保存できないため元に戻しました');return}if(label.textContent!==next)label.textContent=next});
   label.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();label.blur()}});
   d.appendChild(label);
   const add=document.createElement('button');add.className='iconbtn';add.textContent='+';add.title='子枝を追加';add.addEventListener('pointerdown',e=>e.stopPropagation());add.onclick=e=>{e.stopPropagation();select(n.id);addChildNode(n.id,true)};d.appendChild(add);
   if(children(n.id).filter(c=>!c.archived).length){const c=document.createElement('button');c.className='iconbtn';c.textContent=n.collapsed?'▸':'▾';c.title=n.collapsed?'展開':'折りたたみ';c.addEventListener('pointerdown',e=>e.stopPropagation());c.onclick=e=>{e.stopPropagation();pushHistory();n.collapsed=!n.collapsed;render();save()};d.appendChild(c)}
   d.addEventListener('pointerdown',startNodeDrag);d.addEventListener('click',()=>select(n.id));nodesEl.appendChild(d);
  });
  Object.values(state.nodes).forEach(n=>{if(!n.parent||hiddenByAncestor(n)||n.archived)return;const p=state.nodes[n.parent];if(!p||hiddenByAncestor(p)||p.archived)return;const q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',path(p,n));q.setAttribute('fill','none');q.setAttribute('stroke',edgeColor(n));q.setAttribute('stroke-width','4');if(n.suggested)q.setAttribute('stroke-dasharray','8 7');svg.appendChild(q)});
  state.links.forEach(l=>{const a=state.nodes[l.from],b=state.nodes[l.to];if(!a||!b||hiddenByAncestor(a)||hiddenByAncestor(b)||a.archived||b.archived)return;const q=document.createElementNS('http://www.w3.org/2000/svg','path');const isCycle=['cycle','cycle-good','cycle-bad'].includes(l.kind);q.setAttribute('d',isCycle?cyclePath(a,b):path(a,b));q.setAttribute('fill','none');const color=l.kind==='cycle-good'?'#16a34a':l.kind==='cycle-bad'?'#dc2626':l.kind==='cycle'?'#7c3aed':l.kind==='risk'?'#ef4444':'#f59e0b';q.setAttribute('stroke',color);q.setAttribute('stroke-width',isCycle?'3.5':'3');q.setAttribute('stroke-dasharray',isCycle?'':'9 7');if(l.kind==='cycle')q.setAttribute('marker-end','url(#arrowCycle)');if(l.kind==='cycle-good')q.setAttribute('marker-end','url(#arrowCycleGood)');if(l.kind==='cycle-bad')q.setAttribute('marker-end','url(#arrowCycleBad)');if(l.kind==='risk')q.setAttribute('marker-end','url(#arrowRisk)');svg.appendChild(q)});
 }catch(e){console.error(e);failsafe.style.display='block'}
}
function selectionOnly(){document.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',el.dataset.id===state.selected))}
function select(id){state.selected=id;selectionOnly()}
function focusLabel(id){setTimeout(()=>{const el=document.querySelector(`.node[data-id="${id}"] .label`);if(el){el.focus();const r=document.createRange();r.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}},60)}
function addChildNode(parentId,focus){const p=state.nodes[parentId];if(!p)return;if(Object.keys(state.nodes).length>=MAX_NODES)return notify('ノード数の上限は2000です');pushHistory();const s=children(parentId).filter(x=>!x.archived),id=uid();state.nodes[id]={id,text:'新しい枝',x:p.x+280,y:p.y+(s.length-1)*78,parent:parentId,collapsed:false,pinned:false,suggested:false,archived:false,notes:'',lineColor:null};state.selected=id;if(!save()){delete state.nodes[id];state.selected=parentId;history.pop();return notify('容量上限のため追加できません')}render();if(focus)focusLabel(id)}
function insertBetween(){const id=state.selected;if(!id||id==='root')return notify('中心テーマの手前には追加できません');if(Object.keys(state.nodes).length>=MAX_NODES)return notify('ノード数の上限は2000です');const n=state.nodes[id],p=state.nodes[n.parent];if(!p)return;pushHistory();const oldParent=n.parent,mid=uid();state.nodes[mid]={id:mid,text:'中間の考え',x:(p.x+n.x)/2,y:(p.y+n.y)/2,parent:p.id,collapsed:false,pinned:false,suggested:false,archived:false,notes:'',lineColor:null};n.parent=mid;state.selected=mid;if(!save()){delete state.nodes[mid];n.parent=oldParent;state.selected=id;history.pop();return notify('容量上限のため追加できません')}render();focusLabel(mid)}
function startNodeDrag(e){if(e.target.closest('.label')||e.target.closest('button'))return;const id=e.currentTarget.dataset.id,n=state.nodes[id];state.selected=id;selectionOnly();pushHistory();drag={id,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,before:history[history.length-1]};try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){ }e.preventDefault()}
window.addEventListener('pointermove',e=>{if(drag){const n=state.nodes[drag.id];n.x=Math.max(-100000,Math.min(100000,drag.ox+(e.clientX-drag.sx)/state.scale));n.y=Math.max(-100000,Math.min(100000,drag.oy+(e.clientY-drag.sy)/state.scale));n.pinned=true;render()}else if(pan){state.panX=Math.max(-100000,Math.min(100000,pan.ox+(e.clientX-pan.sx)));state.panY=Math.max(-100000,Math.min(100000,pan.oy+(e.clientY-pan.sy)));render()}})

function voiceStateLabel(value){return ({requesting:'開始要求中',requested:'権限・サービス応答待ち',recognizing:'認識開始',audio:'マイク音声を取得中',speech:'発話を検出',result:'結果取得済み',stopping:'終了要求中',aborting:'中止要求中',releasing:'音声セッション解放待ち',ready:'再開可能',failed:'失敗',ended:'終了'})[value]||'待機中'}
function voiceDiagnosticText(session){const events=session.events||[],error=session.error,finish=session.finishResult;const lines=['Chapio Voice Diagnostic','session: '+(session.sessionId||'unknown'),'previousFinishReason: '+(session.previousFinishReason||'none'),'secureContext: '+String(window.isSecureContext),'speechRecognition: '+String(!!window.SpeechRecognition),'webkitSpeechRecognition: '+String(!!window.webkitSpeechRecognition),'userAgent: '+navigator.userAgent];for(const e of events){let line=`${e.sessionId||session.sessionId||'S?'} +${e.ms}ms ${e.name}`;if(e.error)line+=' error='+e.error;if(e.message)line+=' message='+e.message;lines.push(line)}if(error?.code)lines.push('finalError: '+error.code);if(finish){lines.push('finishReason: '+finish.reason);lines.push('onendObserved: '+String(finish.endObserved));lines.push('forcedRelease: '+String(finish.forcedRelease))}return lines.join('\n')}
function voiceHistorySnapshot(session){const safe={sessionId:session.sessionId,previousFinishReason:session.previousFinishReason,state:session.state,events:(session.events||[]).map(e=>({sessionId:e.sessionId,ms:e.ms,name:e.name,error:e.error,message:e.message})),error:session.error?{code:session.error.code,message:session.error.message}:null,finishResult:session.finishResult?{reason:session.finishResult.reason,endObserved:session.finishResult.endObserved,forcedRelease:session.finishResult.forcedRelease}:null};return {sessionId:safe.sessionId||'unknown',reason:safe.finishResult?.reason||safe.error?.code||safe.state||'unknown',diagnostic:voiceDiagnosticText(safe)}}
function appendVoiceDiagnosticHistory(history,entry,limit=10){const next=history.filter(item=>item.sessionId!==entry.sessionId);next.push(entry);return next.slice(-limit)}
function rememberVoiceDiagnostic(session){const entry=voiceHistorySnapshot(session);voiceDiagnosticHistory=appendVoiceDiagnosticHistory(voiceDiagnosticHistory,entry);lastVoiceDiagnostic=entry.diagnostic;return entry.diagnostic}
async function copyVoiceDiagnostic(text){try{await navigator.clipboard.writeText(text);notify('音声診断ログをコピーしました')}catch(_){const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();notify(ok?'音声診断ログをコピーしました':'コピーできません。ログを長押ししてコピーしてください')}}
function showVoiceHistory(selectedId){const selected=voiceDiagnosticHistory.find(item=>item.sessionId===selectedId)||voiceDiagnosticHistory.at(-1);panel.classList.add('voice-panel');panel.innerHTML=`<h3>音声診断履歴</h3><p>直近10セッションをこのページのメモリ内だけに保持します。ページを再読み込みすると履歴は消えます。</p>${voiceDiagnosticHistory.length?`<div class="row">${voiceDiagnosticHistory.map(item=>`<button class="btn small${item===selected?' primary':''}" data-voice-session="${escapeHtml(item.sessionId)}">${escapeHtml(item.sessionId)}：${escapeHtml(item.reason)}</button>`).join('')}</div><pre class="voice-log" id="voiceHistoryLog">${escapeHtml(selected.diagnostic)}</pre><div class="row"><button class="btn small" id="copyVoiceHistory">選択したログをコピー</button><button class="btn small" id="closeVoiceHistory">閉じる</button></div>`:'<p>診断履歴はまだありません。</p><button class="btn small" id="closeVoiceHistory">閉じる</button>'}`;panel.classList.remove('hidden');panel.querySelectorAll('[data-voice-session]').forEach(button=>button.onclick=()=>showVoiceHistory(button.dataset.voiceSession));const copy=$('#copyVoiceHistory');if(copy)copy.onclick=()=>copyVoiceDiagnostic(selected.diagnostic);$('#closeVoiceHistory').onclick=()=>{panel.classList.remove('voice-panel');panel.classList.add('hidden')}}
function renderVoicePanel(session){const events=session.events||[],diagnostic=voiceDiagnosticText(session);lastVoiceDiagnostic=diagnostic;const stateClass=session.state==='failed'?' failed':'';const eventLines=events.length?events.map(e=>{let line=`${e.sessionId||session.sessionId||'S?'} +${e.ms}ms ${e.name}`;if(e.error)line+=' error='+e.error;if(e.message)line+=' message='+e.message;return escapeHtml(line)}).join('\n'):'イベント待機中';panel.classList.add('voice-panel');panel.innerHTML=`<h3>音声入力診断 ${escapeHtml(session.sessionId||'')}</h3><p class="voice-state${stateClass}">状態：${escapeHtml(voiceStateLabel(session.state))}</p><p class="mini">前回終了：${escapeHtml(session.previousFinishReason||'none')}</p>${session.error?`<p>${escapeHtml(session.error.message)}</p><p class="mini">エラーコード：${escapeHtml(session.error.code||'unknown')}</p>`:'<p>認識文章やノード内容は診断ログに記録しません。</p>'}<pre class="voice-log" id="voiceEventLog">${eventLines}</pre><p class="mini">強制解放はJavaScript参照の整理であり、WebKit内部のマイク解放を保証しません。</p><p class="mini">利用できない場合は、ノード文字をタップして標準キーボードのマイク入力を利用できます。</p><div class="row"><button class="btn small" id="copyVoiceLog">診断ログをコピー</button>${session.controller?.isActive()&&!['releasing','ready'].includes(session.state)?'<button class="btn small danger" id="cancelVoiceRecognition">音声入力を中止</button>':session.controller?.isActive()?'':'<button class="btn small" id="closeVoicePanel">閉じる</button>'}</div>`;panel.classList.remove('hidden');$('#copyVoiceLog').onclick=()=>copyVoiceDiagnostic(diagnostic);const cancel=$('#cancelVoiceRecognition');if(cancel)cancel.onclick=()=>session.controller.cancel();const close=$('#closeVoicePanel');if(close)close.onclick=()=>{panel.classList.remove('voice-panel');panel.classList.add('hidden')}}
function showVoiceConfirmation(id,spoken,diagnostic){const node=state.nodes[id];if(!node)return;const draft=voiceDraftText(node.text,spoken);if(!draft)return notify('音声を認識できませんでした');panel.classList.add('voice-panel');panel.innerHTML='<h3>音声入力の確認</h3><p>認識結果を確認・編集してから確定してください。キャンセルすると保存データは変更されません。</p><textarea id="voiceDraft" maxlength="2000"></textarea><div class="row"><button class="btn small primary" id="confirmVoice">確定</button><button class="btn small" id="cancelVoice">キャンセル</button><button class="btn small" id="copyVoiceLog">診断ログをコピー</button></div>';panel.classList.remove('hidden');$('#voiceDraft').value=draft;$('#voiceDraft').focus();$('#copyVoiceLog').onclick=()=>copyVoiceDiagnostic(diagnostic);$('#confirmVoice').onclick=()=>{const next=$('#voiceDraft').value.trim().slice(0,MAX_TEXT);if(!next)return notify('空のテキストは確定できません');if(!commitState(s=>{if(s.nodes[id])s.nodes[id].text=next}))return notify('音声入力を保存できないため変更しませんでした');panel.classList.remove('voice-panel');panel.classList.add('hidden');render();notify('確認した音声入力を保存しました')};$('#cancelVoice').onclick=()=>{panel.classList.remove('voice-panel');panel.classList.add('hidden');notify('音声入力をキャンセルしました')}}
function startVoiceInput(){const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(activeVoiceSession?.controller?.isActive())return notify(activeVoiceSession.state==='releasing'?'前回の音声セッションを解放中です':'音声入力はすでに実行中です');const id=state.selected;if(!id||!state.nodes[id])return notify('入力先の枝を選択してください');const sessionId='S'+(++voiceSessionCounter),previousFinishReason=lastVoiceFinishReason;if(!SpeechRecognition||!window.ChapioVoice){const session={sessionId,previousFinishReason,state:'failed',events:[],error:{code:'unsupported',message:'このブラウザはWeb音声認識に対応していません。ノード文字をタップし、標準キーボードのマイク入力を利用してください。'}};rememberVoiceDiagnostic(session);renderVoicePanel(session);return}const session={id,sessionId,previousFinishReason,state:'requesting',events:[],error:null,transcript:'',controller:null,finishResult:null};session.controller=window.ChapioVoice.createController(SpeechRecognition,{onEvent:(_,events)=>{session.events=events;if(activeVoiceSession===session)renderVoicePanel(session)},onState:value=>{session.state=value;if(value==='recognizing')notify('音声入力を開始しました');else if(value==='audio')notify('マイク音声を取得しています');else if(value==='speech')notify('発話を検出しました');if(activeVoiceSession===session)renderVoicePanel(session)},onResult:transcript=>{session.transcript=transcript},onError:error=>{session.error=error;session.state='failed';notify(error.message);if(activeVoiceSession===session)renderVoicePanel(session)},onFinish:result=>{if(activeVoiceSession!==session)return;activeVoiceSession=null;session.events=result.events;session.finishResult=result;session.state='ready';lastVoiceFinishReason=result.reason;if(!result.resultSeen&&!session.error)session.error={code:'no-result',message:'音声認識は終了しましたが結果がありません。標準キーボードの音声入力も利用できます。'};const diagnostic=rememberVoiceDiagnostic(session);if(result.resultSeen&&session.transcript)return showVoiceConfirmation(id,session.transcript,diagnostic);renderVoicePanel(session)}},{timeoutMs:15000,endWaitMs:2000,quietMs:400,sessionId});activeVoiceSession=session;renderVoicePanel(session);session.controller.start()}
$('#newMap').onclick=()=>{if(confirm('白紙に戻しますか？現在の内容はJSON書出しておくと安心です。')){const blank=defaultState();if(!commitState(s=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,blank)}))return notify('白紙状態を保存できないため変更しませんでした');render();fit()}};
$('#saveLocal').onclick=()=>{notify(save()?(recoveryMode?'復旧領域へ保存しました（破損元は保持）':'この端末に保存しました'):'保存できませんでした')};$('#exportBtn').onclick=exportJson;$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>e.target.files[0]&&importJson(e.target.files[0]);$('#auditBtn').onclick=audit;$('#colorBtn').onclick=showColorPanel;$('#rainbowBtn').onclick=toggleRainbow;$('#archivedListBtn').onclick=showArchived;$('#aiCopyBtn').onclick=copyAI;$('#aiShareBtn').onclick=showAIShare;$('#voiceBtn').onclick=startVoiceInput;$('#voiceHistoryBtn').onclick=()=>showVoiceHistory();$('#fitBtn').onclick=fit;$('#addChild').onclick=()=>state.selected?addChildNode(state.selected,true):notify('枝を選択してください');$('#insertBtn').onclick=insertBetween;$('#togglePin').onclick=()=>{const n=state.nodes[state.selected];if(!n)return;const pinned=!n.pinned;if(!commitState(s=>{s.nodes[state.selected].pinned=pinned}))return notify('配置固定を保存できないため変更しませんでした');render();notify(pinned?'配置を固定しました':'配置固定を解除しました')};$('#connectBtn').onclick=()=>linkSelected('suggestion');$('#cycleBtn').onclick=createCycleLoop;$('#archiveBtn').onclick=archiveSelected;$('#deleteBtn').onclick=()=>{const id=state.selected;if(!id||id==='root')return notify('中心テーマは削除できません');if(!confirm('この枝と子枝を完全削除しますか？「剪定/保留」なら後で戻せます。'))return;const del=[id,...descendants(id)];if(!commitState(s=>{del.forEach(x=>delete s.nodes[x]);s.links=s.links.filter(l=>!del.includes(l.from)&&!del.includes(l.to));s.selected='root'}))return notify('削除を保存できないため元に戻しました');render()};$('#undoBtn').onclick=()=>{if(!history.length)return notify('戻せる履歴がありません');const current=snapshotState(),previous=history[history.length-1];state=parseStoredState(previous);if(!save()){state=parseStoredState(current);return notify('戻す操作を保存できないため変更しませんでした')}history.pop();render()};
let saved=safeGet(),loadedFromStorage=!!saved;if(!saved){for(const k of LEGACY_KEYS){saved=safeGet(k);if(saved){loadedFromStorage=true;break}}}const resolved=resolveStoredState(saved,safeGet(RECOVERY_KEY));state=resolved.state;recoveryMode=resolved.recoveryMode;if(!loadedFromStorage&&!recoveryMode)save();if(recoveryMode&&status)status.textContent='破損元を保持・今後は復旧領域へ保存';
render();if(state.meta&&state.meta.rainbow)$('#rainbowBtn').textContent='🌈 虹色ON';setTimeout(()=>{if(!safeGet())fit()},120);
})();
