<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#f6f8fc"/>
<title>Chapio 思考マップ v1.6</title>
<style>
:root{--bg:#f6f8fc;--grid:#dce6f4;--ink:#172033;--muted:#6d7b91;--line:#3b82f6;--node:#fff;--root:#2f4a73;--accent:#2563eb;--warn:#f59e0b;--danger:#ef4444;--ok:#10b981;--cycle:#7c3aed;--panel:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}button,input,textarea{font:inherit}.app{height:100%;display:flex;flex-direction:column}.topbar{height:62px;background:#fff;border-bottom:1px solid #dbe3ef;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:30;overflow-x:auto;white-space:nowrap}.brand{font-weight:800;font-size:18px;margin-right:6px}.btn{border:1px solid #cbd7e8;background:#fff;border-radius:12px;padding:9px 12px;color:#24334b}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.warn{border-color:#f3c16a;background:#fffaf0}.btn.danger{border-color:#f5b7b7;background:#fff5f5;color:#b42318}.btn.small{padding:7px 10px;font-size:14px}.btn:active{transform:scale(.98)}.main{position:relative;flex:1;overflow:hidden}#canvas{position:absolute;inset:0;touch-action:none;background-image:radial-gradient(var(--grid) 1.3px,transparent 1.3px);background-size:26px 26px;background-color:var(--bg)}#world{position:absolute;left:0;top:0;transform-origin:0 0;width:5000px;height:3500px}#links{position:absolute;left:0;top:0;width:5000px;height:3500px;overflow:visible;pointer-events:none}.node{position:absolute;min-width:150px;max-width:280px;padding:10px 12px;border:2px solid #9db8e8;background:#fff;border-radius:16px;box-shadow:0 5px 16px rgba(30,55,90,.08);display:flex;align-items:center;gap:8px;user-select:none;touch-action:none}.node.root{background:var(--root);color:#fff;border-color:#3b82f6}.node.selected{outline:4px solid rgba(245,158,11,.5)}.node.pinned::after{content:"📌";font-size:12px;position:absolute;right:-8px;top:-10px}.node.suggested{border-style:dashed;border-color:var(--warn);background:#fffaf0}.node.archived{opacity:.35;filter:grayscale(.6)}.label{width:100%;min-width:70px;outline:none;font-weight:700;font-size:17px;line-height:1.35;word-break:break-word;cursor:text}.node:not(.root) .label{font-weight:600;color:#24334b}.iconbtn{width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:#eaf1fb;color:#21344f;font-weight:800;font-size:20px;flex:0 0 auto}.root .iconbtn{background:#fff;color:#203b64}.hint{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.94);border:1px solid #edf1f7;border-radius:14px;padding:10px 12px;color:#64748b;font-size:13px;z-index:15;max-width:min(92%,700px)}.bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;z-index:20;overflow-x:auto;overflow-y:hidden;padding:2px 2px calc(2px + env(safe-area-inset-bottom));scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}.bottom::-webkit-scrollbar{display:none}.bottom .btn{flex:0 0 auto;white-space:nowrap;min-width:max-content}.toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);background:#172033;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:45;max-width:92%;text-align:center}.toast.show{opacity:1}.panel{position:absolute;right:10px;top:10px;width:min(390px,calc(100% - 20px));max-height:calc(100% - 92px);overflow:auto;background:#fff;border:1px solid #dfe6f0;border-radius:16px;padding:14px;z-index:40;box-shadow:0 12px 30px rgba(23,32,51,.16)}.panel h3{margin:0 0 8px}.panel h4{margin:14px 0 6px}.panel p{margin:6px 0;color:#5f6e84;font-size:14px;line-height:1.5}.panel .row{display:flex;gap:8px;flex-wrap:wrap}.panel textarea{width:100%;min-height:110px;border:1px solid #ccd8e8;border-radius:12px;padding:10px;resize:vertical}.hidden{display:none!important}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:12px;background:#eef4ff;color:#2f5f9f;margin-right:4px}.badge.warn{background:#fff4db;color:#a06400}.badge.red{background:#ffe9e9;color:#b42318}.badge.purple{background:#f1eaff;color:#6d28d9}.finding{border-top:1px solid #edf1f7;padding:9px 0}.finding:first-of-type{border-top:0}.failsafe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#2f4a73;color:#fff;border:3px solid #3b82f6;border-radius:16px;padding:14px 18px;font-weight:800;z-index:3}.status{position:absolute;right:12px;bottom:76px;background:rgba(255,255,255,.9);border:1px solid #e2e8f0;border-radius:10px;padding:6px 9px;font-size:12px;color:#64748b;z-index:10}.mini{font-size:12px;color:#7b8797}.switchrow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
@media(max-width:760px){.topbar{height:58px}.brand{font-size:16px}.btn{padding:8px 10px}.hint{font-size:12px}.node{min-width:132px;max-width:235px}.label{font-size:16px}.status{display:none}.bottom{left:8px;right:8px;gap:7px}.bottom .btn{padding:10px 14px;font-size:15px;border-radius:14px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">🌱 <b>Chapio</b> 思考マップ <span style="font-size:12px;color:#70809a">v1.6</span></div>
    <button class="btn small" id="newMap">白紙</button>
    <button class="btn small" id="saveLocal">保存</button>
    <button class="btn small" id="exportBtn">書出</button>
    <button class="btn small" id="importBtn">読込</button>
    <button class="btn small warn" id="auditBtn">AIチェック</button>
    <button class="btn small" id="colorBtn">線カラー</button>
    <button class="btn small" id="rainbowBtn">🌈 虹色OFF</button>
    <button class="btn small" id="archivedListBtn">保留一覧</button>
    <button class="btn small" id="aiCopyBtn">AI用コピー</button>
    <button class="btn small" id="fitBtn">全体表示</button>
    <input id="fileInput" type="file" accept="application/json" hidden>
  </div>
  <div class="main">
    <div id="canvas">
      <div id="world">
        <svg id="links"></svg>
        <div id="nodes"></div>
        <div class="failsafe" id="failsafe">テーマを入力</div>
      </div>
      <div class="hint">文字をタップ：直接編集 ／ ＋：子枝 ／ ▾：開閉 ／ ノード余白をドラッグ：位置変更＋自動固定 ／ 画面ドラッグ：移動 ／ ピンチ：拡大縮小 ／ 循環ループ：3点で一周</div>
      <div class="bottom">
        <button class="btn primary" id="addChild">＋ 子枝</button>
        <button class="btn" id="insertBtn">途中追加</button>
        <button class="btn" id="togglePin">📌 配置固定</button>
        <button class="btn" id="connectBtn">点線関係</button>
        <button class="btn" id="cycleBtn">循環ループ</button>
        <button class="btn warn" id="archiveBtn">剪定/保留</button>
        <button class="btn danger" id="deleteBtn">削除</button>
        <button class="btn" id="undoBtn">↶ 戻す</button>
      </div>
      <div class="status" id="status">端末内保存・外部送信なし</div>
      <div class="toast" id="toast"></div>
      <div class="panel hidden" id="sidePanel"></div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), world=$('#world'), nodesEl=$('#nodes'), svg=$('#links'), canvas=$('#canvas'), toast=$('#toast'), panel=$('#sidePanel'), failsafe=$('#failsafe'), status=$('#status');
let state, history=[], drag=null, pan=null, pinch=null, linkMode=null;
const KEY='chapio-mindmap-v16', LEGACY_KEYS=['chapio-mindmap-v15','chapio-mindmap-v14','chapio-mindmap-v13'];
const uid=()=>Math.random().toString(36).slice(2,9);
function defaultState(){return {version:16,nodes:{root:{id:'root',text:'テーマを入力',x:320,y:340,parent:null,collapsed:false,pinned:false,suggested:false,archived:false,notes:'',lineColor:null}},links:[],selected:'root',panX:0,panY:0,scale:1,meta:{createdAt:Date.now(),updatedAt:Date.now(),rainbow:false}};}
function safeGet(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function safeSet(v){try{localStorage.setItem(KEY,v);return true}catch(e){return false}}
function notify(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function pushHistory(){try{history.push(JSON.stringify(state));if(history.length>80)history.shift()}catch(e){}}
function save(){state.meta=state.meta||{};state.meta.updatedAt=Date.now();const ok=safeSet(JSON.stringify(state));if(status)status.textContent=ok?'端末内保存・外部送信なし':'保存領域なし（JSON書出を推奨）'}
function children(id){return Object.values(state.nodes).filter(n=>n.parent===id)}
function hiddenByAncestor(n){let p=n.parent;while(p){const pn=state.nodes[p];if(!pn)break;if(pn.collapsed||pn.archived)return true;p=pn.parent}return false}
function visibleNodes(){return Object.values(state.nodes).filter(n=>!hiddenByAncestor(n)&&!n.archived)}
const PALETTE=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
function firstLevelAncestor(id){let n=state.nodes[id];if(!n)return null;while(n.parent&&n.parent!=='root')n=state.nodes[n.parent];return n&&n.parent==='root'?n:null}
function rainbowColorFor(id){const top=firstLevelAncestor(id);if(!top)return '#3b82f6';const roots=children('root').filter(n=>!n.archived);const idx=Math.max(0,roots.findIndex(n=>n.id===top.id));return PALETTE[idx%PALETTE.length]}
function edgeColor(n){if(state.meta&&state.meta.rainbow)return rainbowColorFor(n.id);let x=n;while(x){if(x.lineColor)return x.lineColor;x=x.parent?state.nodes[x.parent]:null}return n.suggested?'#f59e0b':'#3b82f6'}
function subtreeIds(id){return [id,...descendants(id)]}
function setBranchColor(color){const id=state.selected;if(!id)return notify('枝を選択してください');pushHistory();subtreeIds(id).forEach(x=>{if(state.nodes[x])state.nodes[x].lineColor=color});render();save();notify('選択した枝系統の線色を変更しました')}
function showColorPanel(){const id=state.selected||'root';let html='<h3>線カラー</h3><p>選択した枝と、その下の子枝へ適用します。虹色モード中は虹色表示が優先されます。</p><div class="row">';PALETTE.forEach(c=>{html+=`<button data-linecolor="${c}" style="width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;background:${c}"></button>`});html+='</div><div class="row" style="margin-top:12px"><button class="btn small" id="resetColor">標準色に戻す</button><button class="btn small" id="closePanel">閉じる</button></div>';panel.innerHTML=html;panel.classList.remove('hidden');panel.querySelectorAll('[data-linecolor]').forEach(b=>b.onclick=()=>setBranchColor(b.dataset.linecolor));$('#resetColor').onclick=()=>{pushHistory();subtreeIds(id).forEach(x=>{if(state.nodes[x])state.nodes[x].lineColor=null});render();save();notify('標準色へ戻しました')};$('#closePanel').onclick=()=>panel.classList.add('hidden')}
function toggleRainbow(){pushHistory();state.meta=state.meta||{};state.meta.rainbow=!state.meta.rainbow;$('#rainbowBtn').textContent=state.meta.rainbow?'🌈 虹色ON':'🌈 虹色OFF';render();save();notify(state.meta.rainbow?'虹色モードON':'虹色モードOFF')}

function path(a,b){const ax=a.x+170,ay=a.y+26,bx=b.x,by=b.y+26,c1=ax+(bx-ax)*.42,c2=bx-(bx-ax)*.42;return `M ${ax} ${ay} C ${c1} ${ay}, ${c2} ${by}, ${bx} ${by}`}
function cyclePath(a,b){const ax=a.x+170,ay=a.y+26,bx=b.x,by=b.y+26,dx=bx-ax,dy=by-ay,span=Math.max(120,Math.hypot(dx,dy)),lift=Math.min(240,Math.max(90,span*.42));const mx=(ax+bx)/2,my=(ay+by)/2-lift;return `M ${ax} ${ay} Q ${mx} ${my}, ${bx} ${by}` }
function addArrowDefs(){const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');defs.innerHTML='<marker id="arrowCycle" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker><marker id="arrowCycleGood" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker><marker id="arrowCycleBad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker><marker id="arrowRisk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ef4444"/></marker>';svg.appendChild(defs)}
function render(){
 try{
  failsafe.style.display='none';
  world.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.scale})`;
  nodesEl.innerHTML='';svg.innerHTML='';addArrowDefs();
  Object.values(state.nodes).forEach(n=>{
   if(hiddenByAncestor(n)||n.archived)return;
   const d=document.createElement('div');
   d.className='node'+(n.parent?'':' root')+(state.selected===n.id?' selected':'')+(n.pinned?' pinned':'')+(n.suggested?' suggested':'');
   d.style.left=n.x+'px';d.style.top=n.y+'px';d.dataset.id=n.id;
   const label=document.createElement('div');label.className='label';label.contentEditable='true';label.spellcheck=true;label.textContent=n.text;
   label.addEventListener('pointerdown',e=>{e.stopPropagation();state.selected=n.id;selectionOnly()});
   label.addEventListener('focus',()=>{state.selected=n.id;selectionOnly();pushHistory()});
   label.addEventListener('input',()=>{n.text=label.textContent;save()});
   label.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();label.blur()}});
   d.appendChild(label);
   const add=document.createElement('button');add.className='iconbtn';add.textContent='+';add.title='子枝を追加';add.addEventListener('pointerdown',e=>e.stopPropagation());add.onclick=e=>{e.stopPropagation();select(n.id);addChildNode(n.id,true)};d.appendChild(add);
   if(children(n.id).filter(c=>!c.archived).length){const c=document.createElement('button');c.className='iconbtn';c.textContent=n.collapsed?'▸':'▾';c.title=n.collapsed?'展開':'折りたたみ';c.addEventListener('pointerdown',e=>e.stopPropagation());c.onclick=e=>{e.stopPropagation();pushHistory();n.collapsed=!n.collapsed;render();save()};d.appendChild(c)}
   d.addEventListener('pointerdown',startNodeDrag);d.addEventListener('click',()=>select(n.id));nodesEl.appendChild(d);
  });
  Object.values(state.nodes).forEach(n=>{if(!n.parent||hiddenByAncestor(n)||n.archived)return;const p=state.nodes[n.parent];if(!p||hiddenByAncestor(p)||p.archived)return;const q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',path(p,n));q.setAttribute('fill','none');q.setAttribute('stroke',edgeColor(n));q.setAttribute('stroke-width','4');if(n.suggested)q.setAttribute('stroke-dasharray','8 7');svg.appendChild(q)});
  state.links.forEach(l=>{const a=state.nodes[l.from],b=state.nodes[l.to];if(!a||!b||hiddenByAncestor(a)||hiddenByAncestor(b)||a.archived||b.archived)return;const q=document.createElementNS('http://www.w3.org/2000/svg','path');const isCycle=['cycle','cycle-good','cycle-bad'].includes(l.kind);q.setAttribute('d',isCycle?cyclePath(a,b):path(a,b));q.setAttribute('fill','none');const color=l.kind==='cycle-good'?'#16a34a':l.kind==='cycle-bad'?'#dc2626':l.kind==='cycle'?'#7c3aed':l.kind==='risk'?'#ef4444':'#f59e0b';q.setAttribute('stroke',color);q.setAttribute('stroke-width',isCycle?'3.5':'3');q.setAttribute('stroke-dasharray',isCycle?'':'9 7');if(l.kind==='cycle')q.setAttribute('marker-end','url(#arrowCycle)');if(l.kind==='cycle-good')q.setAttribute('marker-end','url(#arrowCycleGood)');if(l.kind==='cycle-bad')q.setAttribute('marker-end','url(#arrowCycleBad)');if(l.kind==='risk')q.setAttribute('marker-end','url(#arrowRisk)');svg.appendChild(q)});
 }catch(e){console.error(e);failsafe.style.display='block'}
}
function selectionOnly(){document.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',el.dataset.id===state.selected))}
function select(id){state.selected=id;selectionOnly()}
function focusLabel(id){setTimeout(()=>{const el=document.querySelector(`.node[data-id="${id}"] .label`);if(el){el.focus();const r=document.createRange();r.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}},60)}
function addChildNode(parentId,focus){const p=state.nodes[parentId];if(!p)return;pushHistory();const s=children(parentId).filter(x=>!x.archived),id=uid();state.nodes[id]={id,text:'新しい枝',x:p.x+280,y:p.y+(s.length-1)*78,parent:parentId,collapsed:false,pinned:false,suggested:false,archived:false,notes:'',lineColor:null};state.selected=id;render();save();if(focus)focusLabel(id)}
function insertBetween(){const id=state.selected;if(!id||id==='root')return notify('中心テーマの手前には追加できません');const n=state.nodes[id],p=state.nodes[n.parent];if(!p)return;pushHistory();const mid=uid();state.nodes[mid]={id:mid,text:'中間の考え',x:(p.x+n.x)/2,y:(p.y+n.y)/2,parent:p.id,collapsed:false,pinned:false,suggested:false,archived:false,notes:'',lineColor:null};n.parent=mid;state.selected=mid;render();save();focusLabel(mid)}
function startNodeDrag(e){if(e.target.closest('.label')||e.target.closest('button'))return;const id=e.currentTarget.dataset.id,n=state.nodes[id];state.selected=id;selectionOnly();pushHistory();drag={id,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y};try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){ }e.preventDefault()}
window.addEventListener('pointermove',e=>{if(drag){const n=state.nodes[drag.id];n.x=drag.ox+(e.clientX-drag.sx)/state.scale;n.y=drag.oy+(e.clientY-drag.sy)/state.scale;n.pinned=true;render()}else if(pan){state.panX=pan.ox+(e.clientX-pan.sx);state.panY=pan.oy+(e.clientY-pan.sy);render()}})
window.addEventListener('pointerup',()=>{if(drag||pan)save();drag=null;pan=null})
canvas.addEventListener('pointerdown',e=>{if(e.target!==canvas&&e.target!==world&&e.target!==svg)return;pan={sx:e.clientX,sy:e.clientY,ox:state.panX,oy:state.panY};e.preventDefault()})
canvas.addEventListener('wheel',e=>{e.preventDefault();const old=state.scale,next=Math.max(.35,Math.min(2.2,old*(e.deltaY<0?1.08:.92))),r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,wx=(mx-state.panX)/old,wy=(my-state.panY)/old;state.scale=next;state.panX=mx-wx*next;state.panY=my-wy*next;render();save()},{passive:false})
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pinch={dist:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),scale:state.scale};e.preventDefault()}},{passive:false})
canvas.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){const[a,b]=e.touches,d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);state.scale=Math.max(.35,Math.min(2.2,pinch.scale*d/pinch.dist));render();e.preventDefault()}},{passive:false})
canvas.addEventListener('touchend',()=>{pinch=null;save()})
function fit(){
 const vis=visibleNodes();if(!vis.length)return;
 const boxes=vis.map(n=>{
   const el=document.querySelector(`.node[data-id="${n.id}"]`);
   const w=el?el.offsetWidth:190,h=el?el.offsetHeight:56;
   return {x:n.x,y:n.y,w,h};
 });
 const minX=Math.min(...boxes.map(b=>b.x))-90,maxX=Math.max(...boxes.map(b=>b.x+b.w))+90;
 const minY=Math.min(...boxes.map(b=>b.y))-110,maxY=Math.max(...boxes.map(b=>b.y+b.h))+130;
 const w=maxX-minX,h=maxY-minY,r=canvas.getBoundingClientRect();
 const usableW=Math.max(240,r.width-28),usableH=Math.max(240,r.height-120);
 state.scale=Math.max(.35,Math.min(1.15,Math.min(usableW/w,usableH/h)));
 state.panX=(r.width-w*state.scale)/2-minX*state.scale;
 state.panY=(r.height-h*state.scale)/2-minY*state.scale-20;
 render();save();notify('全体を中央に表示しました')
}
function normalize(s){return (s||'').toLowerCase().replace(/[\s、。・,.!?！？「」『』()（）\-ー]/g,'')}
function grams(s){const x=normalize(s),set=new Set();if(x.length<2){if(x)set.add(x);return set}for(let i=0;i<x.length-1;i++)set.add(x.slice(i,i+2));return set}
function similarity(a,b){const A=grams(a),B=grams(b);if(!A.size||!B.size)return 0;let inter=0;A.forEach(x=>{if(B.has(x))inter++});return inter/(A.size+B.size-inter)}

function contradictionCandidates(nodes){
 const out=[],pairs=[['増やす','減らす'],['続ける','やめる'],['維持','変更'],['固定','柔軟'],['短期','長期'],['攻め','守り'],['買う','売る'],['賛成','反対']];
 for(const n of nodes){const t=normalize(n.text);for(const [a,b] of pairs){if(t.includes(normalize(a))&&t.includes(normalize(b)))out.push({type:'contradiction',text:`「${n.text}」に反対方向の意図（${a}/${b}）が同居しています。条件分けが必要か確認してください。`})}}
 return out;
}
function cycleCandidates(nodes){
 const out=[],seen=new Set();
 for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
  const a=nodes[i],b=nodes[j],sim=similarity(a.text,b.text);
  if(sim>=.48&&sim<.72&&a.parent!==b.parent){
   const key=[a.id,b.id].sort().join('|');if(seen.has(key))continue;seen.add(key);
   out.push({type:'cycleCandidate',a:a.id,b:b.id,text:`「${a.text}」と「${b.text}」が別経路で似た論点に戻っています。循環・堂々巡りか、統合すべき論点か確認してください。`});
  }
 }
 for(const l of state.links){if(!['cycle','cycle-good','cycle-bad'].includes(l.kind))continue;const a=state.nodes[l.from],b=state.nodes[l.to];if(a&&b)out.push({type:'cycleExisting',a:a.id,b:b.id,text:`循環関係：「${a.text}」→「${b.text}」が設定されています（${cycleKindLabel(l.kind)}）。`})}
 return out;
}
function analysisFindings(){const nodes=Object.values(state.nodes).filter(n=>!n.archived),find=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],sim=similarity(a.text,b.text);if(sim>=.72&&normalize(a.text)!==''&&a.id!==b.id)find.push({type:'duplicate',a:a.id,b:b.id,score:sim,text:`「${a.text}」と「${b.text}」は重複/近似の可能性`})}
 const corpus=nodes.map(n=>normalize(n.text)).join(' ');const lenses=[['目的',['目的','ゴール','狙い']],['根拠',['根拠','理由','事実','データ']],['選択肢',['選択肢','案','代替']],['リスク',['リスク','失敗','懸念','弱点']],['相手視点',['相手','相手視点','他者','顧客','家族']],['時間軸',['いつ','期限','短期','長期','将来']],['次の行動',['次','行動','実行','担当']]];lenses.forEach(([name,keys])=>{if(!keys.some(k=>corpus.includes(normalize(k))))find.push({type:'missing',name,text:`「${name}」の観点は検討済みですか？`})});
 const parentless=nodes.filter(n=>n.id!=='root'&&!n.parent);if(parentless.length)find.push({type:'structure',text:'親を持たない枝があります'});find.push(...contradictionCandidates(nodes),...cycleCandidates(nodes));return find}
function audit(){const findings=analysisFindings();let html='<h3>AIチェック</h3><p><b>ローカル分析</b>です。外部AIへ自動送信しません。重複・欠如・矛盾候補・循環候補を確認し、元の枝は勝手に変更しません。</p>';if(!findings.length)html+='<p><span class="badge">結果</span>目立つ問題候補はありません。</p>';findings.forEach(f=>{let tag=f.type==='duplicate'?'<span class="badge red">重複候補</span>':f.type==='missing'?'<span class="badge warn">欠如候補</span>':f.type==='contradiction'?'<span class="badge red">矛盾候補</span>':f.type==='cycleCandidate'?'<span class="badge purple">循環候補</span>':f.type==='cycleExisting'?'<span class="badge purple">循環設定</span>':'<span class="badge">構造</span>';html+=`<div class="finding">${tag}<p>${escapeHtml(f.text)}</p>${f.type==='missing'?`<button class="btn small" data-addmissing="${escapeHtml(f.name)}">点線枝で追加</button>`:''}${f.type==='cycleCandidate'?`<button class="btn small" data-addcycle="${f.a}|${f.b}">循環線として追加</button>`:''}</div>`});html+='<div class="row"><button class="btn small" id="copyFullAI">ChatGPT分析用コピー</button><button class="btn small" id="closePanel">閉じる</button></div>';panel.innerHTML=html;panel.classList.remove('hidden');panel.querySelectorAll('[data-addmissing]').forEach(b=>b.onclick=()=>addSuggested('root',b.dataset.addmissing));panel.querySelectorAll('[data-addcycle]').forEach(b=>b.onclick=()=>{const [from,to]=b.dataset.addcycle.split('|');pushHistory();if(!state.links.some(l=>l.kind==='cycle'&&l.from===from&&l.to===to))state.links.push({from,to,kind:'cycle'});render();save();audit();notify('循環候補を紫の循環線として追加しました')});$('#copyFullAI').onclick=copyAI;$('#closePanel').onclick=()=>panel.classList.add('hidden')}
function addSuggested(parentId,text){const p=state.nodes[parentId],id=uid();pushHistory();state.nodes[id]={id,text,x:p.x+300,y:p.y+220+children(parentId).length*45,parent:parentId,collapsed:false,pinned:false,suggested:true,archived:false,notes:'思考チェック提案',lineColor:null};render();save();notify('点線の提案枝を追加しました')}
function descendants(id){const out=[];(function rec(pid){children(pid).forEach(c=>{out.push(c.id);rec(c.id)})})(id);return out}
function showArchived(){const arr=Object.values(state.nodes).filter(n=>n.archived);let html='<h3>保留中の枝</h3><p>復帰すると、子枝も元の構造のまま再表示されます。</p>';if(!arr.length)html+='<p>保留中の枝はありません。</p>';arr.forEach(n=>{html+='<div class="finding"><span class="badge warn">保留</span><p>'+escapeHtml(n.text)+'</p><button class="btn small" data-restore="'+escapeHtml(n.id)+'">復帰</button></div>'});html+='<div class="row"><button class="btn small" id="closePanel">閉じる</button></div>';panel.innerHTML=html;panel.classList.remove('hidden');panel.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreArchived(b.dataset.restore));$('#closePanel').onclick=()=>panel.classList.add('hidden')}
function restoreArchived(id){const n=state.nodes[id];if(!n)return;pushHistory();n.archived=false;state.selected=id;render();save();showArchived();notify('保留から復帰しました')}
function archiveSelected(){const id=state.selected;if(!id||id==='root')return notify('中心テーマは保留にできません');pushHistory();state.nodes[id].archived=true;state.selected='root';render();save();notify('剪定：保留しました。子枝もまとめて非表示になります')}

function cycleKindLabel(kind){return kind==='cycle-good'?'好循環':kind==='cycle-bad'?'悪循環':'未判定'}
function cycleKindColor(kind){return kind==='cycle-good'?'緑':kind==='cycle-bad'?'赤':'紫'}
function chooseCycleKind(){
 return new Promise(resolve=>{
  panel.innerHTML='<h3>循環タイプ</h3><p>このループの意味を選んでください。</p><div class="row"><button class="btn small" data-ck="cycle-good">好循環（緑）</button><button class="btn small danger" data-ck="cycle-bad">悪循環（赤）</button><button class="btn small" data-ck="cycle">未判定（紫）</button></div><div class="row" style="margin-top:10px"><button class="btn small" id="cancelCycleKind">キャンセル</button></div>';
  panel.classList.remove('hidden');
  panel.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{const k=b.dataset.ck;panel.classList.add('hidden');resolve(k)});
  $('#cancelCycleKind').onclick=()=>{panel.classList.add('hidden');resolve(null)};
 })
}
function waitForNodeTap(message){
 return new Promise(resolve=>{
  notify(message);
  const h=e=>{
   const el=e.target.closest('.node');if(!el)return;
   document.removeEventListener('click',h,true);
   resolve(el.dataset.id);
  };
  setTimeout(()=>document.addEventListener('click',h,true),0);
 })
}
async function createCycleLoop(){
 if(!state.selected)return notify('始点にする枝を選択してください');
 const start=state.selected;
 const kind=await chooseCycleKind();if(!kind)return notify('循環設定をキャンセルしました');
 const mid=await waitForNodeTap('② 次の枝（経由点）をタップしてください');
 if(!mid||mid===start)return notify('同じ枝は経由点にできません');
 const back=await waitForNodeTap('③ 戻り先の枝をタップしてください');
 if(!back)return;
 pushHistory();
 const add=(from,to)=>{if(from===to)return;if(!state.links.some(l=>l.from===from&&l.to===to&&l.kind===kind))state.links.push({from,to,kind})};
 add(start,mid);add(mid,back);
 if(back!==start)add(back,start);
 render();save();
 notify(`${cycleKindLabel(kind)}を作成しました（${cycleKindColor(kind)}の矢印）`);
}
function linkSelected(kind){if(!state.selected)return notify('枝を選択してください');linkMode={from:state.selected,kind};notify(kind==='cycle'?'循環先の枝をタップしてください':'関連づける相手の枝をタップしてください');const h=e=>{const el=e.target.closest('.node');if(!el)return;const to=el.dataset.id;if(to!==linkMode.from){pushHistory();state.links.push({from:linkMode.from,to,kind:linkMode.kind});render();save();notify(kind==='cycle'?'循環関係を追加しました':'点線関係を追加しました')}document.removeEventListener('click',h,true);linkMode=null};setTimeout(()=>document.addEventListener('click',h,true),0)}
function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chapio-mindmap.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function validateIncoming(incoming){if(!incoming||typeof incoming!=='object')throw new Error('JSON形式が不正です');if(!incoming.nodes||typeof incoming.nodes!=='object'||Array.isArray(incoming.nodes))throw new Error('nodesがありません');if(!incoming.nodes.root)throw new Error('中心テーマ(root)がありません');const ids=new Set(Object.keys(incoming.nodes));for(const [id,n] of Object.entries(incoming.nodes)){if(!n||typeof n!=='object')throw new Error('ノード形式が不正です');n.id=id;n.text=typeof n.text==='string'?n.text:'新しい枝';n.x=Number.isFinite(Number(n.x))?Number(n.x):320;n.y=Number.isFinite(Number(n.y))?Number(n.y):340;n.parent=n.parent==null?null:String(n.parent);if(n.parent&&!ids.has(n.parent))throw new Error('親枝が存在しません: '+id);n.collapsed=!!n.collapsed;n.pinned=!!n.pinned;n.suggested=!!n.suggested;n.archived=!!n.archived;n.notes=typeof n.notes==='string'?n.notes:'';n.lineColor=typeof n.lineColor==='string'?n.lineColor:null}incoming.nodes.root.parent=null;incoming.links=Array.isArray(incoming.links)?incoming.links.filter(l=>l&&ids.has(String(l.from))&&ids.has(String(l.to))).map(l=>({from:String(l.from),to:String(l.to),kind:['cycle','cycle-good','cycle-bad','risk','suggestion'].includes(l.kind)?l.kind:'suggestion'})):[];incoming.selected=ids.has(String(incoming.selected))?String(incoming.selected):'root';incoming.panX=Number.isFinite(Number(incoming.panX))?Number(incoming.panX):0;incoming.panY=Number.isFinite(Number(incoming.panY))?Number(incoming.panY):0;incoming.scale=Math.max(.35,Math.min(2.2,Number(incoming.scale)||1));incoming.version=16;incoming.meta=incoming.meta&&typeof incoming.meta==='object'?incoming.meta:{createdAt:Date.now()};incoming.meta.rainbow=!!incoming.meta.rainbow;return incoming}
function importJson(file){const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);const incoming=validateIncoming(parsed);pushHistory();state=incoming;render();save();notify('安全確認して読み込みました')}catch(e){notify('読み込み拒否：'+(e.message||'形式が不正です'))}};r.readAsText(file)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function aiPayload(){const nodes=Object.values(state.nodes).filter(n=>!n.archived).map(n=>({id:n.id,text:n.text,parent:n.parent,notes:n.notes||'',positionFixed:!!n.pinned,suggested:!!n.suggested}));return {title:state.nodes.root?.text||'思考マップ',nodes,links:state.links,localFindings:analysisFindings(),request:'このマインドマップを、元の意図的配置・親子関係を尊重して分析してください。目的・前提・根拠・選択肢・反証・リスク・相手視点・時間軸・次の行動を確認し、重複、矛盾、思考の欠如、循環/堂々巡り、途中挿入候補、統合候補、剪定候補を提示してください。循環は好循環（緑）・悪循環（赤）・未判定（紫）を区別してください。変更は提案として示し、勝手に削除・統合しないでください。'} }
async function copyAI(){const text=JSON.stringify(aiPayload(),null,2);try{await navigator.clipboard.writeText(text);notify('AI分析用データをコピーしました')}catch(e){panel.innerHTML='<h3>AI分析用データ</h3><p>下をコピーしてChatGPTに貼り付けてください。</p><textarea id="aiText"></textarea><button class="btn small" id="closePanel">閉じる</button>';panel.classList.remove('hidden');$('#aiText').value=text;$('#closePanel').onclick=()=>panel.classList.add('hidden')}}
$('#newMap').onclick=()=>{if(confirm('白紙に戻しますか？現在の内容はJSON書出しておくと安心です。')){pushHistory();state=defaultState();render();fit();save()}};
$('#saveLocal').onclick=()=>{save();notify('この端末に保存しました')};$('#exportBtn').onclick=exportJson;$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>e.target.files[0]&&importJson(e.target.files[0]);$('#auditBtn').onclick=audit;$('#colorBtn').onclick=showColorPanel;$('#rainbowBtn').onclick=toggleRainbow;$('#archivedListBtn').onclick=showArchived;$('#aiCopyBtn').onclick=copyAI;$('#fitBtn').onclick=fit;$('#addChild').onclick=()=>state.selected?addChildNode(state.selected,true):notify('枝を選択してください');$('#insertBtn').onclick=insertBetween;$('#togglePin').onclick=()=>{const n=state.nodes[state.selected];if(!n)return;pushHistory();n.pinned=!n.pinned;render();save();notify(n.pinned?'配置を固定しました':'配置固定を解除しました')};$('#connectBtn').onclick=()=>linkSelected('suggestion');$('#cycleBtn').onclick=createCycleLoop;$('#archiveBtn').onclick=archiveSelected;$('#deleteBtn').onclick=()=>{const id=state.selected;if(!id||id==='root')return notify('中心テーマは削除できません');if(!confirm('この枝と子枝を完全削除しますか？「剪定/保留」なら後で戻せます。'))return;pushHistory();const del=[id,...descendants(id)];del.forEach(x=>delete state.nodes[x]);state.links=state.links.filter(l=>!del.includes(l.from)&&!del.includes(l.to));state.selected='root';render();save()};$('#undoBtn').onclick=()=>{if(!history.length)return notify('戻せる履歴がありません');state=JSON.parse(history.pop());render();save()};
try{let saved=safeGet();if(!saved){for(const k of LEGACY_KEYS){try{saved=localStorage.getItem(k)}catch(e){}if(saved)break}}state=saved?validateIncoming(JSON.parse(saved)):defaultState();save()}catch(e){state=defaultState();save()}
render();if(state.meta&&state.meta.rainbow)$('#rainbowBtn').textContent='🌈 虹色ON';setTimeout(()=>{if(!safeGet())fit()},120);
})();
</script>
